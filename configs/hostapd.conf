# /etc/hostapd/hostapd.conf — reference copy of what install.sh writes on the
# first install (later runs keep your file). SSID, channel and passphrase are
# changed from the web UI, which preserves every other line.

interface=wlan0
driver=nl80211

ssid=pi-nat64

# 802.11n on 2.4 GHz, channel 6
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

# WPA2-PSK
wpa=2
wpa_passphrase=ChangeMe123
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# Country code — change to your ISO 3166-1 alpha-2 country
country_code=DE

# Used by the web UI: control socket (hostapd_cli) and the blocked-client list
ctrl_interface=/var/run/hostapd
macaddr_acl=0
deny_mac_file=/etc/hostapd/hostapd.deny
