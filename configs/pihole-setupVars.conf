# Pi-hole unattended install configuration
# Copied to /etc/pihole/setupVars.conf before running the Pi-hole installer on
# a FRESH install; Pi-hole v6 imports these keys into /etc/pihole/pihole.toml.
# install.sh then (re-)applies the important ones with `pihole-FTL --config`, so
# they also take effect when Pi-hole was already installed.
# PIHOLE_INTERFACE is replaced by install.sh with the actual AP interface.

PIHOLE_INTERFACE=wlan0
QUERY_LOGGING=true
DNS_FQDN_REQUIRED=false
DNS_BOGUS_PRIV=false
DNSSEC=false
DNSMASQ_LISTENING=local
PIHOLE_DNS_1=127.0.0.1#5335
PIHOLE_DNS_2=
BLOCKING_ENABLED=true
# FTL's embedded web server/API: loopback only, off ports 80/443 (the pi-nat64 UI)
WEB_PORTS=127.0.0.1:8053
