# /etc/radvd.conf
# Router Advertisement for wlan0
# Tells clients to use fd00::/64 and where to find DNS

interface wlan0 {
    AdvSendAdvert on;
    AdvManagedFlag off;     # SLAAC (stateless)
    AdvOtherConfigFlag on;  # get DNS via DHCPv6 as well

    prefix fd00::/64 {
        AdvOnLink on;
        AdvAutonomous on;
        AdvRouterAddr on;
    };

    # RFC 8106 — embed DNS server in RA
    RDNSS fd00::1 {
        AdvRDNSSLifetime 3600;
    };
};
