# /etc/radvd.conf — reference copy of what install.sh writes.
# Router Advertisements for wlan0: SLAAC prefix + DNS server (RDNSS).
# radvd is the only RA source on the link.

interface wlan0 {
    AdvSendAdvert on;
    AdvManagedFlag off;     # SLAAC (stateless)
    AdvOtherConfigFlag off; # no DHCPv6 — DNS comes from RDNSS below

    prefix fd00::/64 {
        AdvOnLink on;
        AdvAutonomous on;
        AdvRouterAddr on;
    };

    # RFC 8106 — embed DNS server in RA
    RDNSS fd00::1 {
        AdvRDNSSLifetime 3600;
    };
};
