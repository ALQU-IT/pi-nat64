# /etc/sysctl.d/99-pi-nat64.conf — reference copy of what install.sh writes.

net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.default.forwarding = 1

# Accept Router Advertisements on eth0 (from your ISP) even with forwarding on
net.ipv6.conf.eth0.accept_ra = 2

# Only when the AP interface exists (install.sh skips these in a VM):
# we are the router on wlan0, and hostapd restarts must not drop its IPv6 address
net.ipv6.conf.wlan0.accept_ra = 0
net.ipv6.conf.wlan0.keep_addr_on_down = 1
