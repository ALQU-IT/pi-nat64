# /etc/dnsmasq.d/pi-nat64.conf — reference copy of what install.sh writes.
# DHCPv4 for Wi-Fi AP clients only. DNS is Pi-hole (FTL) on :53, so dnsmasq's
# own DNS server is disabled (port=0) — without it dnsmasq would grab :53.
# IPv6 addressing and DNS (RDNSS) come from radvd.

interface=wlan0
bind-interfaces
port=0

dhcp-range=192.168.50.10,192.168.50.200,255.255.255.0,24h
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1
