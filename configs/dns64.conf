# /etc/unbound/unbound.conf.d/dns64.conf — reference copy of what install.sh writes.
# DNS64 — synthesises AAAA records for IPv4-only destinations
# using the same prefix as Jool (64:ff9b::/96)
#
# Listens on 127.0.0.1:5335 only — Pi-hole FTL is the public DNS
# resolver on port 53; it forwards to Unbound for recursion + DNS64.

server:
  interface: 127.0.0.1
  port: 5335

  # Only Pi-hole (localhost) is a valid client
  access-control: 0.0.0.0/0 refuse
  access-control: ::/0 refuse
  access-control: 127.0.0.1/32 allow

  do-ip4: yes
  do-ip6: yes

  # DNSSEC trust anchor (used by the validator module below)
  auto-trust-anchor-file: "/var/lib/unbound/root.key"

  # DNS64 must come before the validator and iterator
  module-config: "dns64 validator iterator"

  # DNS64 prefix must match Jool's pool6. This is a server-clause option
  # (unbound has no "dns64:" section — use dns64-prefix here).
  dns64-prefix: 64:ff9b::/96

# Forward queries to Cloudflare — IPv6 and IPv4, so resolution works whichever
# address family the uplink has
forward-zone:
  name: "."
  forward-addr: 2606:4700:4700::1111
  forward-addr: 2606:4700:4700::1001
  forward-addr: 1.1.1.1
  forward-addr: 1.0.0.1
