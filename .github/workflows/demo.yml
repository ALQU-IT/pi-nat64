# Rebuilds the GitHub Pages demo (docs/) from the real web UI.
#
# docs/ is generated by scripts/build-demo.py from web/templates and
# web/static. Whenever those (or the demo's own files) change on main, this
# workflow re-runs the build and commits the refreshed docs/, so the live demo
# always matches the product. On pull requests it only checks that the demo
# still builds.

name: Demo

on:
  push:
    branches: [main]
    paths:
      - "web/templates/**"
      - "web/static/**"
      - "docs/static/js/demo-api.js"
      - "docs/static/css/demo.css"
      - "scripts/build-demo.py"
      - ".github/workflows/demo.yml"
  pull_request:
    paths:
      - "web/templates/**"
      - "web/static/**"
      - "docs/static/js/demo-api.js"
      - "docs/static/css/demo.css"
      - "scripts/build-demo.py"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

# One rebuild at a time per branch; a queued run picks up the latest commit.
concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit the rebuilt docs/ on main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Jinja2
        run: python -m pip install --quiet jinja2

      - name: Build demo
        run: python scripts/build-demo.py

      - name: Check demo JavaScript
        run: for f in docs/static/js/*.js; do node --check "$f"; done

      - name: Commit rebuilt demo
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git add -A docs
          if git diff --cached --quiet; then
            echo "Demo is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Demo: rebuild from ${GITHUB_SHA::7}"
          # A push made with GITHUB_TOKEN does not trigger another workflow run.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "Push rejected (main moved on) — rebasing and retrying…"
            git pull --rebase origin main
          done
          exit 1
